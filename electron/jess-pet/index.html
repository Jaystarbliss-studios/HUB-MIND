<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none';">
  <title>Jess · Hub-Mind Companion</title>
  <link rel="stylesheet" href="./pet.css">
  <script src="./manifest.js" defer></script>
  <script src="./pet.js" defer></script>
</head>
<body>
  <main class="pet-shell" aria-label="Jess desktop companion">
    <div class="speech" id="speech" role="status" aria-live="polite" hidden>
      <canvas id="expression" width="64" height="64" aria-hidden="true"></canvas>
      <span id="speech-text">I'm here.</span>
    </div>
    <button class="character-hitbox" id="character" type="button" aria-label="Jess. Click for a reaction or double-click to open Hub-Mind.">
      <canvas id="jess-canvas" width="256" height="256" aria-label="Animated Jess character"></canvas>
    </button>
    <div class="pet-toolbar" aria-label="Jess actions">
      <button type="button" data-action="open" title="Open Hub-Mind" aria-label="Open Hub-Mind">Open</button>
      <button type="button" data-state="walk" title="Walk animation">Walk</button>
      <button type="button" data-state="think" title="Thinking animation">Think</button>
      <button type="button" data-state="celebrate" title="Celebrate animation">Yay!</button>
      <button type="button" data-action="hide" title="Hide Jess" aria-label="Hide Jess">Hide</button>
    </div>
    <div class="offline-status" id="status">Jess is here · local mode</div>
  </main>
</body>
</html>
