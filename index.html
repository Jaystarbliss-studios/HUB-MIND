    <title>Hub-Mind</title>
    <script>
      // Suppress benign [vite] HMR connection notices and websocket connection messages in container environment
      (function() {
        const isViteNotice = (args) => {
          if (!args) return false;
          const items = Array.isArray(args) ? args : [args];
          return items.some(arg => {
            if (!arg) return false;
            let fullText = '';
            if (typeof arg === 'string') {
              fullText = arg;
            } else if (typeof arg === 'object') {
              fullText = String(arg.message || arg.stack || arg.reason || arg.name || '') + ' ' + (typeof arg.toString === 'function' ? arg.toString() : '');
            } else {
              fullText = String(arg);
            }
            const lower = fullText.toLowerCase();
            return (
              lower.includes('[vite]') ||
              lower.includes('failed to connect to websocket') ||
              lower.includes('vite:') ||
              lower.includes('/@vite/') ||
              lower.includes('@vite') ||
              lower.includes('cannot connect to websocket') ||
              lower.includes('server is unavailable') ||
              lower.includes('hmr') ||
              lower.includes('hot reload')
            );
          });
        };

        const origWarn = console.warn;
        const origError = console.error;
        const origLog = console.log;
        const origInfo = console.info;
        const origDebug = console.debug;

        console.warn = function(...args) {
          if (isViteNotice(args)) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (isViteNotice(args)) return;
          origError.apply(console, args);
        };
        console.log = function(...args) {
          if (isViteNotice(args)) return;
          origLog.apply(console, args);
        };
        if (origInfo) {
          console.info = function(...args) {
            if (isViteNotice(args)) return;
            origInfo.apply(console, args);
          };
        }
        if (origDebug) {
          console.debug = function(...args) {
            if (isViteNotice(args)) return;
            origDebug.apply(console, args);
          };
        }

        window.onerror = function(msg, url, line, col, error) {
          if (isViteNotice([msg, url, error])) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (!event) return;
          if (isViteNotice([event.message, event.filename, event.error])) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          if (isViteNotice([event.reason])) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <style>
      vite-error-overlay {
        display: none !important;
      }

        #pwa-splash {
          position: fixed;
          inset: 0;
          background-color: #0f172a;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          transition: opacity 0.3s ease-out;
        }

          width: 80px;
          height: 80px;
          margin-bottom: 24px;
          animation: pwa-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pwa-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: .7; transform: scale(0.95); }
        }
        .pwa-title {
          color: white;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 24px;
          font-weight: 700;
          margin: 0 0 8px 0;
        }
        .pwa-subtitle {
          color: #94a3b8;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 14px;
        }

        <path d="M19.938 10.5a4 4 0 0 1 .585.396"/>
        <path d="M6 18a4 4 0 0 1-1.967-.516"/>
        <path d="M19.967 17.484A4 4 0 0 1 18 18"/>

      <h1 class="pwa-title">Hub-Mind</h1>
      <p class="pwa-subtitle">Loading Workspace...</p>
      <script>
        // Dismiss splash screen quickly
        setTimeout(function() {
          var el = document.getElementById('pwa-splash');
          if (el) {
            el.style.opacity = '0';
            el.style.pointerEvents = 'none';
            setTimeout(function() { if (el && el.parentNode) el.parentNode.removeChild(el); }, 300);
          }
        }, 300);
      </script>
    </div>
