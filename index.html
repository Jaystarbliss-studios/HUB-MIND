<!doctype html>
<html lang="en">
  <head>
    <script>
      // Suppress benign [vite] HMR connection notices and mock Vite WebSocket in container environment
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          const OrigWebSocket = window.WebSocket;
          const isViteWs = function(url, protocols) {
            const urlStr = String(url || '').toLowerCase();
            if (urlStr.includes('vite') || urlStr.includes('hmr') || urlStr.includes('ping')) return true;
            if (typeof protocols === 'string' && (protocols.includes('vite') || protocols.includes('hmr'))) return true;
            if (Array.isArray(protocols) && protocols.some(function(p) { return String(p).toLowerCase().includes('vite') || String(p).toLowerCase().includes('hmr'); })) return true;
            return false;
          };

          function ViteMockWebSocket(url, protocols) {
            if (!(this instanceof ViteMockWebSocket)) {
              return new ViteMockWebSocket(url, protocols);
            }
            if (!isViteWs(url, protocols)) {
              return new OrigWebSocket(url, protocols);
            }
            const self = this;
            this.url = String(url || '');
            this.protocol = typeof protocols === 'string' ? protocols : (Array.isArray(protocols) ? protocols[0] : 'vite-hmr');
            this.readyState = OrigWebSocket.OPEN || 1;
            this.binaryType = 'blob';
            this.bufferedAmount = 0;
            this.extensions = '';
            this.onopen = null;
            this.onclose = null;
            this.onerror = null;
            this.onmessage = null;
            const listeners = {};

            this.addEventListener = function(type, listener) {
              if (!listeners[type]) listeners[type] = [];
              listeners[type].push(listener);
            };

            this.removeEventListener = function(type, listener) {
              if (!listeners[type]) return;
              listeners[type] = listeners[type].filter(function(l) { return l !== listener; });
            };

            this.dispatchEvent = function(event) {
              const type = event && event.type;
              if (listeners[type]) {
                listeners[type].forEach(function(fn) {
                  try { fn.call(self, event); } catch (e) {}
                });
              }
              if (type === 'open' && typeof self.onopen === 'function') {
                try { self.onopen.call(self, event); } catch (e) {}
              }
              if (type === 'message' && typeof self.onmessage === 'function') {
                try { self.onmessage.call(self, event); } catch (e) {}
              }
              if (type === 'close' && typeof self.onclose === 'function') {
                try { self.onclose.call(self, event); } catch (e) {}
              }
              if (type === 'error' && typeof self.onerror === 'function') {
                try { self.onerror.call(self, event); } catch (e) {}
              }
              return true;
            };

            this.send = function(data) {
              try {
                const parsed = typeof data === 'string' ? JSON.parse(data) : null;
                if (parsed && parsed.type === 'ping') {
                  setTimeout(function() {
                    self.dispatchEvent(new MessageEvent('message', { data: JSON.stringify({ type: 'pong' }) }));
                  }, 10);
                }
              } catch (e) {}
            };

            this.close = function() {
              self.readyState = OrigWebSocket.CLOSED || 3;
              self.dispatchEvent(new CloseEvent('close'));
            };

            setTimeout(function() {
              self.readyState = OrigWebSocket.OPEN || 1;
              self.dispatchEvent(new Event('open'));
              setTimeout(function() {
                self.dispatchEvent(new MessageEvent('message', { data: JSON.stringify({ type: 'connected' }) }));
              }, 20);
            }, 10);
          }

          ViteMockWebSocket.CONNECTING = OrigWebSocket.CONNECTING || 0;
          ViteMockWebSocket.OPEN = OrigWebSocket.OPEN || 1;
          ViteMockWebSocket.CLOSING = OrigWebSocket.CLOSING || 2;
          ViteMockWebSocket.CLOSED = OrigWebSocket.CLOSED || 3;
          ViteMockWebSocket.prototype = OrigWebSocket.prototype;

          window.WebSocket = ViteMockWebSocket;
        }

        const isViteNotice = (args) => {
          if (!args) return false;
          const items = Array.isArray(args) ? args : [args];
          return items.some(arg => {
            if (!arg) return false;
            let fullText = '';
            try {
              if (typeof arg === 'string') {
                fullText = arg;
              } else if (typeof arg === 'object') {
                fullText = String(arg.message || arg.stack || arg.reason || arg.name || '') + ' ' + (typeof arg.toString === 'function' ? arg.toString() : '');
              } else {
                fullText = String(arg);
              }
            } catch (e) {
              fullText = '';
            }
            const lower = fullText.toLowerCase();
            return (
              lower.includes('[vite]') ||
              lower.includes('failed to connect to websocket') ||
              lower.includes('vite:') ||
              lower.includes('/@vite/') ||
              lower.includes('@vite') ||
              lower.includes('cannot connect to websocket') ||
              lower.includes('server is unavailable') ||
              lower.includes('hmr') ||
              lower.includes('hot reload') ||
              lower.includes('vite-ping') ||
              lower.includes('vite-hmr')
            );
          });
        };

        const origWarn = console.warn;
        const origError = console.error;
        const origLog = console.log;
        const origInfo = console.info;
        const origDebug = console.debug;

        console.warn = function(...args) {
          if (isViteNotice(args)) return;
          origWarn.apply(console, args);
        };
        console.error = function(...args) {
          if (isViteNotice(args)) return;
          origError.apply(console, args);
        };
        console.log = function(...args) {
          if (isViteNotice(args)) return;
          origLog.apply(console, args);
        };
        if (origInfo) {
          console.info = function(...args) {
            if (isViteNotice(args)) return;
            origInfo.apply(console, args);
          };
        }
        if (origDebug) {
          console.debug = function(...args) {
            if (isViteNotice(args)) return;
            origDebug.apply(console, args);
          };
        }

        window.onerror = function(msg, url, line, col, error) {
          if (isViteNotice([msg, url, error])) {
            return true;
          }
        };

        window.addEventListener('error', function(event) {
          if (!event) return;
          if (isViteNotice([event.message, event.filename, event.error])) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          if (!event) return;
          if (isViteNotice([event.reason])) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
