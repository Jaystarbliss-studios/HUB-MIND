name: Post-audit hardening

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  harden:
    if: ${{ !startsWith(github.event.head_commit.message, '[hardening-bot]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply integrity patches
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1. Firebase is authoritative after a successful document snapshot.
          # Remove the legacy branch that merged arbitrary missing local records
          # back into the cloud list and therefore resurrected deleted documents.
          p = Path('src/pages/Documents.tsx')
          s = p.read_text(encoding='utf-8')
          start = s.find('          // Also merge in any local drafts not yet present in the Firestore collection')
          end = s.find('          if (localModified) {', start)
          if start >= 0 and end > start:
              s = s[:start] + s[end:]
              p.write_text(s, encoding='utf-8')

          # 2. Reports must use actual line breaks. The old source escaped the
          # separator twice, producing visible "\\n" in WhatsApp/textareas.
          p = Path('src/pages/Dashboard.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("lines.join('\\\\n')", "lines.join('\\n')")
          s = s.replace("].join('\\\\n')", "].join('\\n')")
          p.write_text(s, encoding='utf-8')

          # 3. Do not manufacture demo documents when local cache is empty.
          p = Path('src/lib/offlineSync.ts')
          s = p.read_text(encoding='utf-8')
          old = """  const defaults = getDefaultDocs();
  try {
    localStorage.setItem(OFFLINE_DOCS_KEY, JSON.stringify(defaults));
  } catch {}
  return defaults;"""
          s = s.replace(old, "  return {};", 1)
          p.write_text(s, encoding='utf-8')

          # 4. Avoid passing undefined as a Firestore query constraint in the
          # admin daily-schedule share path.
          p = Path('src/pages/Dashboard.tsx')
          s = p.read_text(encoding='utf-8')
          old = """      const [tasksSnap, meetingsSnap] = await Promise.all([
        getDocs(query(collection(db, 'tasks'), profile.role === 'admin' || profile.role === 'assistant' ? undefined : where('assignedTo', '==', profile.id) as any)),
        getDocs(collection(db, 'meetings'))
      ]);"""
          new = """      const tasksSnap = await getDocs(
        profile.role === 'admin' || profile.role === 'assistant'
          ? query(collection(db, 'tasks'))
          : query(collection(db, 'tasks'), where('assignedTo', '==', profile.id))
      );
      const meetingsSnap = await getDocs(collection(db, 'meetings'));"""
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit hardening changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No hardening changes required."
            exit 0
          fi
          git add src/pages/Documents.tsx src/pages/Dashboard.tsx src/lib/offlineSync.ts
          git commit -m "[hardening-bot] prevent stale cache resurrection and fix dashboard data flows"
          git push origin HEAD:main
