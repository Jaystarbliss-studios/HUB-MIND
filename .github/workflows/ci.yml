name: HUB-MIND CI

on:
  push:
    branches: ["main", "jess-integration-complete", "feat/jess-full-control-parity"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Jess integration verification
        run: npm run verify:jess
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Firestore security emulator tests
        run: npm run test:rules
      - name: Production build
        run: npm run build

  validate-native-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Preflight PowerShell syntax
        shell: pwsh
        run: |
          $paths = @('electron/jess-agent.ps1', 'scripts/install-jess-chrome-bridge.ps1')
          foreach ($relativePath in $paths) {
            $tokens = $null
            $errors = $null
            $fullPath = Join-Path $PWD $relativePath
            [System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}:{1}: {2} near [{3}]" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
              exit 1
            }
          }
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Windows native build dependencies are installed
        run: npm install --no-save --include=optional @rollup/rollup-win32-x64-msvc@4.62.4 lightningcss-win32-x64-msvc@1.32.0 @tailwindcss/oxide-win32-x64-msvc@4.3.3
      - name: Publish self-contained .NET Chrome native host
        run: dotnet publish native/JessChromeNativeHost/JessChromeNativeHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/JessChromeNativeHost/publish
      - name: Publish self-contained .NET offline wake helper
        run: dotnet publish native/JessOfflineWake/JessOfflineWake.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/JessOfflineWake/publish
      - name: Publish self-contained .NET Windows OCR helper
        run: dotnet publish native/JessWindowsOcr/JessWindowsOcr.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/JessWindowsOcr/publish
      - name: Validate PowerShell agent and Chrome installer syntax
        shell: pwsh
        run: |
          $paths = @('electron/jess-agent.ps1', 'scripts/install-jess-chrome-bridge.ps1')
          foreach ($relativePath in $paths) {
            $tokens = $null
            $errors = $null
            $fullPath = Join-Path $PWD $relativePath
            [System.Management.Automation.Language.Parser]::ParseFile($fullPath, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("{0}:{1}: {2} near [{3}]" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text) }
              exit 1
            }
          }
      - name: TypeScript validation
        run: npm run typecheck
      - name: Smoke-test native PowerShell sidecar startup and Win32 interop compilation
        shell: pwsh
        run: |
          $request = '{"id":"ci-list-windows","method":"list_windows","args":{}}'
          $raw = @($request | & powershell.exe -NoLogo -NoProfile -NonInteractive -STA -ExecutionPolicy Bypass -File electron/jess-agent.ps1)
          if ($LASTEXITCODE -ne 0) {
            $detail = $raw -join [Environment]::NewLine
            throw "Native helper exited with code $LASTEXITCODE. Output: $detail"
          }
          $messages = @($raw | ForEach-Object { $_ | ConvertFrom-Json -ErrorAction Stop })
          if ($messages.Count -lt 2 -or $messages[0].type -ne 'ready') {
            $detail = $raw -join [Environment]::NewLine
            throw "Native helper did not emit the ready handshake and list_windows response. Output: $detail"
          }
          $response = $messages | Where-Object { $_.id -eq 'ci-list-windows' } | Select-Object -First 1
          if ($null -eq $response -or $response.result.ok -ne $true) {
            $detail = $raw -join [Environment]::NewLine
            throw "Native list_windows smoke test failed. Output: $detail"
          }
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never
