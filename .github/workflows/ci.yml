name: HUB-MIND CI

on:
  push:
    branches: ["main", "audit-phase-1-10"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: TypeScript validation
        run: npm run lint

      - name: System integrity audit
        run: npm run audit

      - name: Production build
        run: npm run build
