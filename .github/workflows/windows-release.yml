name: Hub-Mind Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'electron/**'
      - 'electron-builder.yml'
      - 'package.json'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Rollup Windows native binary is installed
        run: npm install --no-save --include=optional @rollup/rollup-win32-x64-msvc@4.62.4 lightningcss-win32-x64-msvc@1.32.0 @tailwindcss/oxide-win32-x64-msvc@4.3.3
      - name: Verify assistant integration
        run: npm run verify:jess
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Build web workspace
        run: npm run build
      - name: Package Windows installer
        run: npx electron-builder --win nsis --publish never
      - name: Archive installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-mind-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish installer to GitHub release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('desktop-v{0}', github.run_number) }}
          name: Hub-Mind Windows Installer ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('desktop-v{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: release/*.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
