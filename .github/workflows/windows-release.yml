name: Hub-Mind Windows Installer

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'electron/**'
      - 'native/**'
      - 'chrome-extension/**'
      - 'scripts/install-jess-chrome-bridge.ps1'
      - 'scripts/uninstall-jess-chrome-bridge.ps1'
      - 'electron-builder.yml'
      - 'package.json'
      - 'src/**'
      - 'tests/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/windows-release.yml'
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'electron/**'
      - 'native/**'
      - 'chrome-extension/**'
      - 'scripts/install-jess-chrome-bridge.ps1'
      - 'scripts/uninstall-jess-chrome-bridge.ps1'
      - 'electron-builder.yml'
      - 'package.json'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - '.github/workflows/windows-release.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Ensure Rollup Windows native binary is installed
        run: npm install --no-save --include=optional @rollup/rollup-win32-x64-msvc@4.62.4 lightningcss-win32-x64-msvc@1.32.0 @tailwindcss/oxide-win32-x64-msvc@4.3.3
      - name: Publish self-contained .NET Chrome native host
        run: dotnet publish native/JessChromeNativeHost/JessChromeNativeHost.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/JessChromeNativeHost/publish
      - name: Publish self-contained .NET offline wake helper
        run: dotnet publish native/JessOfflineWake/JessOfflineWake.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/JessOfflineWake/publish
      - name: Publish self-contained .NET Windows OCR helper
        run: dotnet publish native/JessWindowsOcr/JessWindowsOcr.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/JessWindowsOcr/publish
      - name: Verify assistant integration
        run: npm run verify:jess
      - name: Validate PowerShell agent syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'electron/jess-agent.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_.Message }; exit 1 }
      - name: TypeScript validation
        run: npm run typecheck
      - name: Unit and contract tests
        run: npm run test:unit
      - name: Build web workspace
        run: npm run build
      - name: Prepare optional Windows code-signing certificate
        id: prepare_signing_certificate
        if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Output 'No signing certificate configured; the installer will remain unsigned.'
            "has_certificate=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $certificatePath = Join-Path $env:RUNNER_TEMP 'hubmind-windows-signing.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          "HUBMIND_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HUBMIND_SIGNING_CERTIFICATE_PASSWORD=$env:WINDOWS_CERTIFICATE_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "has_certificate=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Generate valid 256px Windows icon from official logo
        shell: pwsh
        run: ./scripts/generate-windows-icon.ps1
      - name: Package Windows installer
        timeout-minutes: 15
        env:
          CSC_LINK: ''
          CSC_KEY_PASSWORD: ''
          WIN_CSC_LINK: ''
          WIN_CSC_KEY_PASSWORD: ''
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never
      - name: Preserve unsigned installer for signing fallback
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'release\*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'electron-builder did not produce a Windows installer.' }
          Copy-Item -LiteralPath $installer.FullName -Destination (Join-Path $env:RUNNER_TEMP 'Hub-Mind-Setup-unsigned.exe') -Force
      - name: Sign Windows installer (optional)
        id: sign_installer
        if: ${{ steps.prepare_signing_certificate.outputs.has_certificate == 'true' }}
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
          $sdkRoot = Join-Path $programFilesX86 'Windows Kits\10\bin'
          if (!(Test-Path -LiteralPath $sdkRoot)) { throw 'Windows SDK not found; installer will remain unsigned.' }
          $signtool = Get-ChildItem -Path $sdkRoot -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64\signtool.exe' } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found; installer will remain unsigned.' }
          $installer = Get-ChildItem -Path 'release\*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'No Windows installer was found to sign.' }
          & $signtool sign /f $env:HUBMIND_SIGNING_CERTIFICATE_PATH /p $env:HUBMIND_SIGNING_CERTIFICATE_PASSWORD /fd SHA256 /tr 'http://timestamp.digicert.com' /td SHA256 /v $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignTool failed with exit code $LASTEXITCODE." }
          & $signtool verify /pa /v $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw "SignTool verification failed with exit code $LASTEXITCODE." }
      - name: Restore unsigned installer if optional signing fails
        if: ${{ steps.sign_installer.outcome == 'failure' }}
        shell: pwsh
        run: |
          $backup = Join-Path $env:RUNNER_TEMP 'Hub-Mind-Setup-unsigned.exe'
          $installer = Get-ChildItem -Path 'release\*.exe' -File | Select-Object -First 1
          if (!(Test-Path -LiteralPath $backup) -or -not $installer) {
            throw 'Could not restore the installer after signing failure.'
          }
          Copy-Item -LiteralPath $backup -Destination $installer.FullName -Force
          Write-Output 'Optional signing did not finish successfully; restored the unsigned installer.'
      - name: Verify Windows installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path 'release\*.exe' -File | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1000000) {
            throw 'Windows installer output is missing or unexpectedly small.'
          }
          Write-Output ("Installer artifact ready: {0} bytes at {1}" -f $installer.Length, $installer.FullName)
      - name: Archive installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hub-mind-windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Archive Jess Chrome extension for manual installation
        shell: pwsh
        run: Compress-Archive -Path chrome-extension\* -DestinationPath release\Jess-Chrome-Extension.zip -Force
      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: jess-chrome-extension
          path: release/Jess-Chrome-Extension.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
    needs: windows-installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: hub-mind-windows-installer
          path: release
      - name: Download Jess Chrome extension artifact
        uses: actions/download-artifact@v4
        with:
          name: jess-chrome-extension
          path: release
      - name: Publish installer and extension to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('desktop-v{0}', github.run_number) }}
          name: Hub-Mind Windows Installer ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('desktop-v{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.exe
            release/Jess-Chrome-Extension.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
