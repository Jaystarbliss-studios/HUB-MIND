<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Choose what to share · Jess</title>
<style>
:root{color-scheme:dark;font-family:Segoe UI,Arial,sans-serif;background:#020617;color:#f8fafc}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#123039 0,#020617 55%);padding:26px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.kicker{color:#5eead4;text-transform:uppercase;letter-spacing:.18em;font-size:11px;font-weight:700}
h1{font-size:26px;line-height:1.2;margin:9px 0 8px;font-weight:650}p{color:#94a3b8;font-size:13px;line-height:1.5;margin:0}
button{font:inherit;cursor:pointer}
.cancel{border:1px solid #334155;border-radius:12px;padding:9px 15px;background:#0f172a;color:#e2e8f0}
.cancel:hover{background:#1e293b}
#status{margin:0 0 16px;font-size:13px;color:#94a3b8}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.source{overflow:hidden;text-align:left;padding:0;border:1px solid #334155;border-radius:16px;background:rgba(15,23,42,.9);color:#f8fafc;transition:border-color .15s,transform .15s}
.source:hover,.source:focus{border-color:#5eead4;transform:translateY(-1px);outline:2px solid rgba(94,234,212,.2)}
.preview{aspect-ratio:16/9;background:#0f172a;display:grid;place-items:center;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover}
.details{padding:12px 14px 14px}.type{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#5eead4;font-weight:700}.name{font-size:13px;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
footer{margin-top:22px;padding-top:15px;border-top:1px solid #1e293b;color:#64748b;font-size:11px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}body{padding:18px}}@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div><div class="kicker">Jess · Screen sharing</div><h1>Choose what to share</h1><p>Select one display or application window. Only the selected source will be shared.</p></div><button id="cancel" class="cancel" type="button">Cancel</button></header>
<div id="status" role="status">Loading available screens and windows…</div><section id="sources" class="grid" aria-label="Available screens and windows"></section>
<footer>Cancel to keep your screen private. This chooser remains above other windows until you choose or cancel.</footer>
<script>
(() => {
 const status=document.getElementById('status'), grid=document.getElementById('sources'), api=window.hubMindScreenShare;
 const cancel=()=>{try{void api?.cancel()}catch{}};
 document.getElementById('cancel').addEventListener('click',cancel);
 window.addEventListener('keydown',event=>{if(event.key==='Escape')cancel()});
 if(!api){status.textContent='The secure desktop chooser bridge is unavailable.';return}
 api.onSources(items=>{
   grid.replaceChildren();
   const sources=Array.isArray(items)?items:[];
   status.textContent=sources.length?('Select one of '+sources.length+' available sources.'):'No shareable screens or windows were found.';
   for(const source of sources){
     const button=document.createElement('button');button.type='button';button.className='source';
     const preview=document.createElement('div');preview.className='preview';
     if(source.thumbnailDataUrl){const img=document.createElement('img');img.src=source.thumbnailDataUrl;img.alt='';preview.appendChild(img)}
     else preview.textContent='Preview unavailable';
     const details=document.createElement('div');details.className='details';
     const type=document.createElement('div');type.className='type';type.textContent=source.isScreen?'Display':'Application window';
     const name=document.createElement('div');name.className='name';name.textContent=String(source.name||'Application window');name.title=name.textContent;
     details.append(type,name);button.append(preview,details);
     button.addEventListener('click',()=>{button.disabled=true;status.textContent='Starting screen share…';void api.choose(source.id).catch(()=>{button.disabled=false;status.textContent='Could not select that source. Choose again or cancel.'})});
     grid.appendChild(button);
   }
 });
})();
</script>
</body>
</html>
